  function statTile(num, lbl){
    return '<div class="stat-tile"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
  }

  function itemSalesToday(){
    var counts = {};
    todaysOrders().forEach(function(o){
      if(o.status === "REJECTED" || o.status === "CANCELLED") return;
      o.items.forEach(function(l){
        if(!counts[l.name]) counts[l.name] = { name:l.name, qty:0, revenue:0 };
        counts[l.name].qty += l.qty;
        counts[l.name].revenue += l.qty * l.price;
      });
    });
    return Object.keys(counts).map(function(k){ return counts[k]; }).sort(function(a,b){ return b.qty - a.qty; });
  }

  var STAGE_ORDER = ["PENDING","ACCEPTED","PREPARING","READY","COMPLETED"];
  var STAGE_LABEL = { PENDING:"Placed", ACCEPTED:"Accepted", PREPARING:"Preparing", READY:"Ready", COMPLETED:"Done" };
  function renderStageTimeline(o){
    if(o.status === "REJECTED" || o.status === "CANCELLED"){
      var bt = o.stageTimes && o.stageTimes[o.status];
      return '<div class="stage-line">✕ ' + (o.status==="REJECTED"?"Rejected":"Cancelled") + (bt ? (" · " + fmtTime(bt)) : "") + '</div>';
    }
    var idx = STAGE_ORDER.indexOf(o.status);
    var html = '<div class="stage-line">';
    STAGE_ORDER.forEach(function(s, i){
      var reached = i <= idx;
      var t = o.stageTimes && o.stageTimes[s];
      html += '<span class="stage-dot' + (reached?' reached':'') + (i===idx?' current':'') + '">' + STAGE_LABEL[s] + (reached && t ? ('<b>'+fmtTime(t)+'</b>') : '') + '</span>';
      if(i < STAGE_ORDER.length-1) html += '<span class="stage-sep' + (i<idx?' done':'') + '"></span>';
    });
    html += '</div>';
    return html;
  }

  var REASON_CHIPS = ["Item unavailable","Shop closing","At capacity","Other"];
  function renderQueueRow(o, isOpen){
    var stateClass = isOpen ? "is-open" : "is-closed";
    var html = '<div class="queue-row ' + stateClass + ' qr-' + o.status + '">';
    html += '<div class="queue-main">';
    html += '<div class="queue-token">' + esc(o.tokenDisplay) + '</div>';
    html += '<div class="queue-who"><div class="nm">' + esc(o.name) + '</div><div class="ph">' + esc(o.phone) + '</div></div>';
    html += '<div class="queue-items"><span class="fulfil-icon">' + (o.fulfilment==="DELIVERY"?"🛵":"🚶") + '</span> ' + o.items.map(function(l){ return l.qty+'×'+esc(l.name); }).join(", ") + (o.notes ? ' — "' + esc(o.notes) + '"' : '') + '</div>';
    html += '<div class="queue-amt">' + money(o.total) + '</div>';
    html += '<span class="status-pill st-' + o.status + '">' + o.status + '</span>';
    if(o.status==="READY" || o.status==="COMPLETED"){
      html += '<span class="paid-pill paid-' + o.paymentStatus + '">' + (o.paymentStatus==="PAID"?"Paid":"Due") + '</span>';
    }
    html += '</div>';
    html += renderStageTimeline(o);

    html += '<div class="queue-actions">';
    var custWa = waLink(o.phone, statusUpdateText(o));
    if(custWa && o.status !== "PENDING"){
      html += '<a class="btn btn-sm btn-ghost" href="' + custWa + '" target="_blank" rel="noopener" title="Message ' + esc(o.name) + ' on WhatsApp" style="text-decoration:none">📲 Notify</a>';
    }
    if(o.status === "PENDING"){
      html += '<button class="btn btn-owner btn-sm" data-accept="' + o.id + '">Accept</button>';
      html += '<button class="btn btn-danger btn-sm" data-reject="' + o.id + '">Reject</button>';
    } else if(o.status === "ACCEPTED"){
      html += '<button class="btn btn-owner btn-sm" data-prepare="' + o.id + '">Start preparing</button>';
    } else if(o.status === "PREPARING"){
      html += '<button class="btn btn-owner btn-sm" data-ready="' + o.id + '">Mark ready</button>';
    } else if(o.status === "READY"){
      if(o.paymentStatus !== "PAID") html += '<button class="btn btn-sm" data-paid="' + o.id + '">Mark paid</button>';
      html += '<button class="btn btn-owner btn-sm" data-complete="' + o.id + '">Complete</button>';
    }
    html += '</div>';

    if(custWa && o.status !== "PENDING"){
      html += '<div class="wa-preview">📲 will send: “' + esc(statusUpdateText(o)) + '”</div>';
    }

    if(state.ui.rejecting === o.id){
      html += '<div class="reject-panel"><div class="hint">Reason (shown to the customer)</div><div class="chip-row" id="reject-chips">';
      REASON_CHIPS.forEach(function(c){ html += '<button type="button" class="chip" data-reason-chip="' + esc(c) + '">' + c + '</button>'; });
      html += '</div><div class="row"><input type="text" id="reject-reason-text" placeholder="Reason..." style="flex:1;min-width:160px">';
      html += '<button class="btn btn-danger btn-sm" data-confirm-reject="' + o.id + '">Confirm reject</button>';
      html += '<button class="btn btn-ghost btn-sm" data-cancel-reject="1">Cancel</button></div></div>';
    }

    html += '</div>';
    return html;
  }

  /* ============ Events ============ */
  function bindEvents(){
    var app = document.getElementById("app");

    app.addEventListener("click", onAppClick);
    app.addEventListener("change", onAppChange);
    app.addEventListener("input", onAppInput);
    app.addEventListener("keydown", onAppKeydown);
  }

  function onAppKeydown(e){
    if(e.key === "Enter" && e.target.id === "pin-input"){ submitPin(); }
    if(e.key === "Enter" && (e.target.id === "in-cust-login-name" || e.target.id === "in-cust-login-phone")){ submitCustLogin(); }
  }

  function q(el, sel){ return el.closest ? el.closest(sel) : null; }

  function onAppClick(e){
    var t = e.target;
    var id;

    if(t.id === "pin-backdrop"){ state.ui.showPin = false; persist(); render(); return; }
    if(t.id === "btn-pin-cancel"){ state.ui.showPin = false; persist(); render(); return; }
    if(t.id === "btn-pin-submit"){ submitPin(); return; }

    if(t.id === "cust-login-backdrop"){ state.ui.showCustLogin = false; persist(); render(); return; }
    if(t.id === "btn-cust-login-cancel"){ state.ui.showCustLogin = false; persist(); render(); return; }
    if(t.id === "btn-cust-login-submit"){ submitCustLogin(); return; }

    var ownerTab;
    if((ownerTab = attr(t,"data-owner-tab"))){ state.ui.ownerTab = ownerTab; persist(); render(); return; }

    var rmId;
    if((rmId = attr(t,"data-remove-item"))){
      if(state.shop.todaySpecialId === rmId) updateShop({ todaySpecialId: "" });
      delete state.ui.cart[rmId];
      mutateMenuCloud(function(arr){ return arr.filter(function(m){ return m.id !== rmId; }); });
      toast("Item removed"); return;
    }
    if(t.id === "btn-add-item"){
      var nName = (state.ui.newItemName||"").trim();
      var nPrice = parseInt(state.ui.newItemPrice,10);
      if(!nName){ toast("Give the new item a name first."); return; }
      if(!(nPrice >= 0)){ toast("Give the new item a valid price."); return; }
      var newItem = {
        id: uid(), name: nName, local: (state.ui.newItemLocal||"").trim(),
        price: nPrice, available: true, occasion: (state.ui.newItemOccasion||"").trim()
      };
      state.ui.newItemName = ""; state.ui.newItemLocal = ""; state.ui.newItemPrice = ""; state.ui.newItemOccasion = "";
      mutateMenuCloud(function(arr){ return arr.concat([newItem]); });
      toast("Added " + nName + " to the menu"); return;
    }

    if(t.id === "btn-enter-hubs"){ state.ui.customerStep = "hubs"; persist(); render(); return; }
    if(t.id === "btn-to-welcome"){ state.ui.customerStep = "welcome"; persist(); render(); return; }
    if(t.id === "btn-to-hubs"){ state.ui.customerStep = "hubs"; persist(); render(); return; }
    if(attr(t,"data-open-hub")){ state.ui.customerStep = "shop"; persist(); render(); return; }

    if((id = attr(t,"data-add"))){ state.ui.cart[id] = (state.ui.cart[id]||0)+1; persist(); render(); return; }
    if((id = attr(t,"data-inc"))){ state.ui.cart[id] = (state.ui.cart[id]||0)+1; persist(); render(); return; }
    if((id = attr(t,"data-dec"))){ state.ui.cart[id] = Math.max(0,(state.ui.cart[id]||0)-1); persist(); render(); return; }
    if((id = attr(t,"data-remove"))){ delete state.ui.cart[id]; persist(); render(); return; }

    var f;
    if((f = attr(t,"data-fulfil"))){ state.ui.fulfilment = f; persist(); render(); return; }

    if(t.id === "btn-place" || attr(t,"btn-place")){ placeOrder(); return; }
    if(t.id === "btn-new-order"){ state.ui.activeOrderId = null; state.ui.cart={}; persist(); render(); return; }

    if((id = attr(t,"data-accept"))){ setOrderStatus(id,"ACCEPTED"); return; }
    if((id = attr(t,"data-prepare"))){ setOrderStatus(id,"PREPARING"); return; }
    if((id = attr(t,"data-ready"))){ setOrderStatus(id,"READY"); return; }
    if((id = attr(t,"data-complete"))){ setOrderStatus(id,"COMPLETED"); return; }
    if((id = attr(t,"data-paid"))){ markPaid(id); return; }
    if((id = attr(t,"data-reject"))){ state.ui.rejecting = id; render(); return; }
    if(t.id === "btn-cancel-reject" || attr(t,"data-cancel-reject")){ state.ui.rejecting = null; render(); return; }
    if((id = attr(t,"data-confirm-reject"))){
      var txt = document.getElementById("reject-reason-text");
      confirmReject(id, txt ? txt.value.trim() : "");
      return;
    }
    var chip;
    if((chip = attr(t,"data-reason-chip"))){
      var box = document.getElementById("reject-reason-text");
      if(box){ box.value = chip === "Other" ? "" : chip; box.focus(); }
      return;
    }

    if(t.id === "btn-save-closure"){
      updateShop({ closureReason: document.getElementById("in-closure-reason").value.trim() });
      toast("Closure reason saved"); return;
    }
    if(t.id === "btn-save-holiday"){
      var from = document.getElementById("in-hol-from").value;
      var to = document.getElementById("in-hol-to").value;
      var reason = document.getElementById("in-hol-reason").value.trim();
      if(from && to && from > to){ toast("Start date must be before end date"); return; }
      updateShop({ holidayFrom: from, holidayTo: to, holidayReason: reason });
      toast("Holiday saved"); return;
    }
    if(t.id === "btn-clear-holiday"){
      updateShop({ holidayFrom: "", holidayTo: "", holidayReason: "" });
      toast("Holiday cleared"); return;
    }
    var wd = attr(t,"data-weekday");
    if(wd !== null){
      wd = +wd;
      var wh = (state.shop.weeklyHolidays||[]).slice();
      var pos = wh.indexOf(wd);
      if(pos === -1) wh.push(wd); else wh.splice(pos,1);
      updateShop({ weeklyHolidays: wh }); return;
    }
    if(t.id === "btn-export-csv"){ exportOrdersCsv(); return; }
    if(t.id === "btn-voice-test"){ speak("This is a test announcement for " + state.shop.name + "."); return; }

    if(t.id === "btn-lock-now"){
      state.ui.ownerUnlocked = false; state.ui.role = "customer"; state.ui.customerStep = "welcome";
      persist(); render(); toast("Owner view locked"); return;
    }
    if(t.id === "btn-reset-arm"){ state.ui.resetArm = true; render(); return; }
    if(t.id === "btn-reset-cancel"){ state.ui.resetArm = false; render(); return; }
    if(t.id === "btn-reset-go"){
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      state.ui.role = "owner"; state.ui.ownerUnlocked = true;
      persist(); render(); toast("Demo data reset"); return;
    }
  }
  function attr(el, name){
    var n = el.closest ? el.closest("[" + name + "]") : null;
    return n ? n.getAttribute(name) : null;
  }

  function onAppChange(e){
    var t = e.target;
    if(t.id === "tg-open"){ updateShop({ isOpenManual: t.checked }); toast(t.checked?"Hub marked open":"Hub marked closed"); return; }
    if(t.id === "tg-delivery"){
      if(!t.checked && state.ui.fulfilment==="DELIVERY") state.ui.fulfilment="PICKUP";
      updateShop({ deliveryEnabled: t.checked }); toast(t.checked?"Home delivery enabled":"Home delivery disabled"); return;
    }
    if(t.id === "tg-voice"){
      updateShop({ voiceAnnounce: t.checked });
      toast(t.checked ? "Voice alerts on" : "Voice alerts off");
      if(t.checked) speak("Voice alerts are on.");
      return;
    }
    if(t.id === "sel-special"){ updateShop({ todaySpecialId: t.value }); return; }
    if(t.id === "in-open-time-1"){ updateShop({ openTime1: t.value }); return; }
    if(t.id === "in-close-time-1"){ updateShop({ closeTime1: t.value }); return; }
    if(t.id === "in-open-time-2"){ updateShop({ openTime2: t.value }); return; }
    if(t.id === "in-close-time-2"){ updateShop({ closeTime2: t.value }); return; }
    if(t.id === "in-avg-prep"){
      var prepVal = parseInt(t.value,10);
      updateShop({ avgPrepMinutes: (isNaN(prepVal) || prepVal < 1) ? 8 : prepVal });
      return;
    }
    // Free-text shop fields sync on blur (change), not every keystroke — avoids a cloud
    // echo mid-typing rebuilding the input and yanking the cursor away.
    if(t.id === "in-owner-whatsapp"){ if(cloud.enabled) cloud.db.ref("shop").update({ ownerWhatsapp: t.value }); return; }
    if(t.id === "in-shop-address"){ if(cloud.enabled) cloud.db.ref("shop").update({ address: t.value }); return; }
    if(t.id === "in-shop-address-local"){ if(cloud.enabled) cloud.db.ref("shop").update({ addressLocal: t.value }); return; }
    if(t.id === "in-staff-pin"){ if(cloud.enabled) cloud.db.ref("shop").update({ staffPin: t.value }); return; }
    var id;
    if((id = attr(t,"data-price"))){
      var newPrice = Math.max(0, parseInt(t.value,10) || 0);
      mutateMenuCloud(function(arr){
        var it = arr.find(function(m){ return m.id === id; });
        if(it) it.price = newPrice;
        return arr;
      });
      return;
    }
    if((id = attr(t,"data-avail"))){
      var newAvail = t.checked;
      mutateMenuCloud(function(arr){
        var it = arr.find(function(m){ return m.id === id; });
        if(it) it.available = newAvail;
        return arr;
      });
      return;
    }
  }

  function onAppInput(e){
    var t = e.target;
    if(t.id === "in-name"){ state.ui.name = t.value; persist(); }
    else if(t.id === "in-phone"){ state.ui.phone = t.value; persist(); }
    else if(t.id === "in-address"){ state.ui.address = t.value; persist(); }
    else if(t.id === "in-notes"){ state.ui.notes = t.value; persist(); }
    else if(t.id === "in-owner-whatsapp"){ state.shop.ownerWhatsapp = t.value; persist(); }
    else if(t.id === "in-shop-address"){ state.shop.address = t.value; persist(); }
    else if(t.id === "in-shop-address-local"){ state.shop.addressLocal = t.value; persist(); }
    else if(t.id === "in-staff-pin"){ state.shop.staffPin = t.value; persist(); }
    else if(t.id === "pin-input"){ state.ui.pinInput = t.value; state.ui.pinError = ""; persist(); }
    else if(t.id === "in-cust-login-name"){ state.ui.custLoginName = t.value; state.ui.custLoginError = ""; persist(); }
    else if(t.id === "in-cust-login-phone"){ state.ui.custLoginPhone = t.value; state.ui.custLoginError = ""; persist(); }
    else if(t.id === "in-new-item-name"){ state.ui.newItemName = t.value; persist(); }
    else if(t.id === "in-new-item-local"){ state.ui.newItemLocal = t.value; persist(); }
    else if(t.id === "in-new-item-price"){ state.ui.newItemPrice = t.value; persist(); }
    else if(t.id === "in-new-item-occasion"){ state.ui.newItemOccasion = t.value; persist(); }
  }

  function placeOrder(){
    var lines = cartLines();
    var errBox = document.getElementById("cart-err");
    function showErr(msg){ if(errBox){ errBox.style.display="block"; errBox.textContent = msg; } }
    if(lines.length === 0) return;
    var name = (state.ui.name||"").trim();
    var phone = (state.ui.phone||"").trim();
    if(!name){ showErr("Please enter your name."); return; }
    if(!/^\d{10}$/.test(phone.replace(/\D/g,""))){ showErr("Please enter a valid 10-digit mobile number."); return; }
    var address = (state.ui.address||"").trim();
    if(state.ui.fulfilment === "DELIVERY" && !address){ showErr("Please enter a delivery address."); return; }
    state.ui.customerLoggedIn = true;

    function finish(seq){
      if(seq == null){ showErr("Could not reach the shop right now — please try again."); return; }
      var id = (cloud.enabled && cloud.db) ? cloud.db.ref("orders").push().key : uid();
      var order = {
        id: id,
        tokenSeq: seq,
        tokenDisplay: tokenDisplay(seq),
        serviceDate: todayStr(),
        name: name, phone: phone,
        fulfilment: state.ui.fulfilment,
        address: state.ui.fulfilment==="DELIVERY" ? address : "",
        items: lines.map(function(l){ return { name:l.item.name, price:l.item.price, qty:l.qty }; }),
        total: cartTotal(lines),
        notes: (state.ui.notes||"").trim(),
        status: "PENDING",
        paymentStatus: "DUE",
        rejectReason: "",
        createdAt: nowMs(),
        updatedAt: nowMs(),
        stageTimes: { PENDING: nowMs() }
      };
      state.orders.push(order);
      if(cloud.enabled) cloud.db.ref("orders/" + id).set(order);
      state.ui.cart = {};
      state.ui.notes = "";
      state.ui.activeOrderId = order.id;
      persist();
      render();
      toast("Order placed — token " + order.tokenDisplay);
    }

    if(cloud.enabled) allocateTokenCloud(finish);
    else finish(allocateToken());
  }

  function setOrderStatus(id, status){
    var o = state.orders.find(function(x){ return x.id===id; });
    if(!o) return;
    var now = nowMs();
    patchOrderCloud(id, { status: status, updatedAt: now, ["stageTimes/" + status]: now });
    render();
    toast(o.tokenDisplay + " → " + status.charAt(0)+status.slice(1).toLowerCase());
  }
  function markPaid(id){
    var o = state.orders.find(function(x){ return x.id===id; });
    if(!o) return;
    patchOrderCloud(id, { paymentStatus: "PAID", updatedAt: nowMs() });
    render(); toast(o.tokenDisplay + " marked paid");
  }
  function confirmReject(id, reason){
    var o = state.orders.find(function(x){ return x.id===id; });
    if(!o) return;
    var now = nowMs();
    patchOrderCloud(id, { status: "REJECTED", rejectReason: reason || "Not specified", updatedAt: now, ["stageTimes/REJECTED"]: now });
    state.ui.rejecting = null;
    render(); toast(o.tokenDisplay + " rejected");
  }
  function fmtTime(ts){ return new Date(ts).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}); }

  /* ---------- Voice announcements for new orders ---------- */
  function speak(text){
    if(!(window.speechSynthesis && window.SpeechSynthesisUtterance)) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95; u.pitch = 1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function announceOrder(o){
    var itemsText = o.items.map(function(l){ return l.qty + " " + l.name; }).join(", ");
    speak("New order. Token " + o.tokenDisplay.replace(/-/g," ") + ". " + itemsText + ". " +
      (o.fulfilment === "DELIVERY" ? "Home delivery." : "Pickup."));
  }
  // Only the owner's tab cares; only orders placed since this device last checked get read out,
  // so re-opening the dashboard never re-announces the whole day's history.
  function checkNewOrdersAndAnnounce(){
    if(state.ui.role !== "owner" || !state.shop.voiceAnnounce) return;
    var last = state.ui.lastSeenOrderTs || 0;
    var fresh = state.orders.filter(function(o){ return o.createdAt > last && o.serviceDate === todayStr() && o.status === "PENDING"; });
    if(fresh.length === 0) return;
    fresh.sort(function(a,b){ return a.createdAt - b.createdAt; }).forEach(announceOrder);
    state.ui.lastSeenOrderTs = nowMs();
    persist();
  }
  // Merge shared shop/order data written by another tab of the same browser, without touching
  // this tab's own session (role, unlock state, cart, in-progress form fields).
  function mergeIncomingSharedState(incoming){
    state.hub = incoming.hub || state.hub;
    state.shop = Object.assign({}, DEFAULT_STATE.shop, incoming.shop || {});
    state.menu = (incoming.menu && incoming.menu.length) ? incoming.menu : state.menu;
    state.counter = incoming.counter || state.counter;
    state.orders = incoming.orders || state.orders;
  }
  window.addEventListener("storage", function(e){
    // Once Firebase is connected it's the single source of truth for shared data —
    // this same-browser-tab fallback is only for when the cloud is unreachable.
    if(cloud.enabled) return;
    if(e.key !== STORE_KEY || !e.newValue) return;
    var incoming;
    try{ incoming = JSON.parse(e.newValue); }catch(err){ return; }
    mergeIncomingSharedState(incoming);
    render(); // render() itself runs the new-order check, so any fresh order gets announced here
  });

  // Phones aggressively suspend background tabs — Firebase's listeners can be throttled
  // and miss firing a voice alert while the screen is off or another app is in front.
  // Catch up the moment the tab is looked at again instead of waiting for the next
  // unrelated render.
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){ checkNewOrdersAndAnnounce(); render(); }
  });

  /* ---------- Cloud connect: subscribe to shared data, seed it if this is a brand-new DB ---------- */
  function seedCloudIfEmpty(){
    cloud.db.ref("shop").once("value").then(function(snap){
      if(snap.exists()) return;
      cloud.db.ref().update({
        hub: DEFAULT_STATE.hub,
        shop: DEFAULT_STATE.shop,
        menu: DEFAULT_STATE.menu,
        counter: DEFAULT_STATE.counter
      });
    }).catch(function(){});
  }
  function attachCloudListeners(){
    cloud.db.ref("hub").on("value", function(snap){ if(snap.exists()){ state.hub = snap.val(); render(); } });
    cloud.db.ref("shop").on("value", function(snap){ if(snap.exists()){ state.shop = Object.assign({}, DEFAULT_STATE.shop, snap.val()); render(); } });
    cloud.db.ref("menu").on("value", function(snap){
      if(!snap.exists()) return;
      state.menu = snap.val();
      var droppedAny = false;
      Object.keys(state.ui.cart).forEach(function(id){
        if(!state.menu.find(function(m){ return m.id === id; })){ delete state.ui.cart[id]; droppedAny = true; }
      });
      if(droppedAny){ persist(); toast("An item in your cart is no longer on the menu — it's been removed"); }
      render();
    });
    cloud.db.ref("counter").on("value", function(snap){ if(snap.exists()){ state.counter = snap.val(); } });
    cloud.db.ref("orders").on("value", function(snap){
      var val = snap.val();
      state.orders = val ? Object.keys(val).map(function(k){ var o = val[k]; o.id = k; return o; }) : [];
      render();
    });
  }
  (function initCloud(){
    if(!(window.firebase && firebaseConfig && firebaseConfig.apiKey)) return;
    try{
      firebase.initializeApp(firebaseConfig);
      cloud.db = firebase.database();
      cloud.enabled = true;
      cloud.db.ref(".info/serverTimeOffset").on("value", function(snap){
        serverTimeOffsetMs = snap.val() || 0;
      });
      seedCloudIfEmpty();
      attachCloudListeners();
    }catch(e){ cloud.enabled = false; cloud.db = null; }
  })();

  function submitPin(){
    var entered = (state.ui.pinInput||"").trim();
    var expected = (state.shop.staffPin||"1234").trim();
    if(entered && entered === expected){
      state.ui.ownerUnlocked = true;
      state.ui.role = "owner";
      state.ui.showPin = false;
      state.ui.pinInput = "";
      state.ui.pinError = "";
      persist(); render(); toast("Owner dashboard unlocked");
    } else {
      state.ui.pinError = "Incorrect PIN — try again.";
      persist(); render();
      var el = document.getElementById("pin-input");
      if(el) el.focus();
    }
  }

  function submitCustLogin(){
    var name = (state.ui.custLoginName||"").trim();
    var phone = (state.ui.custLoginPhone||"").trim();
    if(!name){ state.ui.custLoginError = "Please enter your name."; persist(); render(); return; }
    if(!/^\d{10}$/.test(phone.replace(/\D/g,""))){ state.ui.custLoginError = "Please enter a valid 10-digit mobile number."; persist(); render(); return; }
    state.ui.name = name;
    state.ui.phone = phone.replace(/\D/g,"");
    state.ui.customerLoggedIn = true;
    state.ui.showCustLogin = false;
    state.ui.custLoginError = "";
    persist(); render(); toast("Welcome, " + name.split(" ")[0] + "!");
  }

  /* ============ Portal access ============
     The owner dashboard is reached only through the "Owner Login" link
     in the footer, gated by a PIN (set in Owner → Contact, default 1234).
     Customers on the plain link never see any control that leads there. */
  document.getElementById("btn-open-staff").addEventListener("click", function(){
    state.ui.showPin = true; state.ui.pinError = ""; state.ui.pinInput = "";
    persist(); render();
    setTimeout(function(){ var el = document.getElementById("pin-input"); if(el) el.focus(); }, 30);
  });
  document.getElementById("mode-pill-slot").addEventListener("click", function(e){
    var t = e.target;
    var r = attr(t,"data-staff-role");
    if(r){ state.ui.role = r; persist(); render(); return; }
    if(t.id === "btn-lock-staff" || attr(t,"data-lock-staff")){
      state.ui.ownerUnlocked = false; state.ui.role = "customer"; state.ui.customerStep = "welcome";
      persist(); render(); toast("Owner view locked"); return;
    }
    if(t.id === "btn-cust-login"){
      state.ui.showCustLogin = true; state.ui.custLoginError = "";
      state.ui.custLoginName = state.ui.name; state.ui.custLoginPhone = state.ui.phone;
      persist(); render();
      setTimeout(function(){ var el = document.getElementById("in-cust-login-name"); if(el) el.focus(); }, 30);
      return;
    }
    if(t.id === "btn-cust-logout"){
      state.ui.customerLoggedIn = false; state.ui.name = ""; state.ui.phone = "";
      persist(); render(); toast("Logged out");
    }
  });

  render();
})();
</script>
</body>
</html>
